version: 0.1
component: build
timeoutInSeconds: 6000
runAs: root
shell: bash
env:
  # these are local variables to the build config
  variables:
    key: "value"

  # the value of a vaultVariable is the secret-id (in OCI ID format) stored in the OCI Vault service
  # you can then access the value of that secret in your build_spec.yaml commands
  vaultVariables:
  
  # exportedVariables are made available to use as parameters in sucessor Build Pipeline stages
  # For this Build to run, the Build Pipeline needs to have a BUILDRUN_HASH parameter set
  exportedVariables:
    - BUILDRUN_HASH

steps:
  - type: Command
    name: "Define build version suffix"
    timeoutInSeconds: 40
    command: |
      set -euo pipefail
      export BUILDRUN_HASH="$(echo "${OCI_BUILD_RUN_ID}" | rev | cut -c 1-7)"
      export IMAGE_TAG="0.1.0-${BUILDRUN_HASH}"
      export CHART_VERSION="0.1.0"
      echo "BUILDRUN_HASH: ${BUILDRUN_HASH}"
      echo "IMAGE_TAG: ${IMAGE_TAG}"
      echo "CHART_VERSION: ${CHART_VERSION}"

  - type: Command
    timeoutInSeconds: 1800
    name: "Build and push container image"
    command: |
      set -euo pipefail

      APP_SOURCE_DIR="${OCI_WORKSPACE_DIR}/foggykitchen-hello-world"
      if [ ! -d "${APP_SOURCE_DIR}" ]; then
        DOCKERFILE_PATH="$(find "${OCI_WORKSPACE_DIR}" -maxdepth 5 -type f -name Dockerfile ! -path '*/.git/*' -print -quit || true)"
        if [ -n "${DOCKERFILE_PATH}" ]; then
          APP_SOURCE_DIR="$(dirname "${DOCKERFILE_PATH}")"
        else
          APP_SOURCE_DIR=""
        fi
      fi

      if [ -z "${APP_SOURCE_DIR}" ] || [ ! -d "${APP_SOURCE_DIR}" ]; then
        echo "Application source directory for foggykitchen-hello-world was not found."
        exit 1
      fi

      echo "Using app source directory: ${APP_SOURCE_DIR}"
      cd "${APP_SOURCE_DIR}"

      podman build --pull --rm -t foggykitchen-hello-world:latest .

  - type: Command
    timeoutInSeconds: 1200
    name: "Package and push Helm chart"
    command: |
      set -euo pipefail
      HELM_SOURCE_DIR="${OCI_PRIMARY_SOURCE_DIR:-${OCI_WORKSPACE_DIR}/helm-foggykitchen-hello-world}"
      cd "${HELM_SOURCE_DIR}/helm/helm-foggykitchen-hello-world-chart"

      echo "Packaging chart version ${CHART_VERSION}"
      rm -f ./*.tgz
      helm package . --version "${CHART_VERSION}" --app-version "${BUILDRUN_HASH}"
      helm registry login "${OCI_REGISTRY}" -u "${OCIR_USER_NAME}" -p "${USER_AUTH_TOKEN}"
      helm push ./*.tgz "${HELM_REPO_URL}"

outputArtifacts:
  - name: APPLICATION_DOCKER_IMAGE
    type: DOCKER_IMAGE
    location: foggykitchen-hello-world:latest
